[package]
name = "agentdog"
version = "0.1.0"
description = "Cost and context monitoring for local AI agents"
authors = ["Li Shen"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
notify = "8"
dirs = "6"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
